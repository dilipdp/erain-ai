  <text x="1164" y="308" fill="#BEDCF6" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Governance coverage</text>

  <rect x="1140" y="396" width="252" height="144" rx="18" fill="url(#nodeB)" stroke="#90CCFF" stroke-opacity="0.38"/>
  <text x="1164" y="430" fill="#B2DEFF" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.13em">ACTION CLOSURE</text>
  <text x="1164" y="470" fill="#EFF9FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">88%</text>
  <text x="1164" y="498" fill="#BEDCF6" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Cycle closure rate</text>

  <rect x="1140" y="586" width="252" height="144" rx="18" fill="url(#nodeB)" stroke="#82DED6" stroke-opacity="0.38"/>
  <text x="1164" y="620" fill="#B4F0E8" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.13em">FIRST VALUE WINDOW</text>
  <text x="1164" y="660" fill="#ECFFFC" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">12 Weeks</text>
  <text x="1164" y="688" fill="#B9ECE4" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Time to verified impact</text>

  <path d="M802 326L924 468L802 610L680 468L802 326Z" fill="url(#engine)" stroke="#9CD8FF" stroke-opacity="0.72"/>
  <path d="M802 370L884 468L802 566L720 468L802 370Z" fill="#0F386F" stroke="#83CBFF" stroke-opacity="0.6"/>
  <text x="802" y="468" fill="#EEF8FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="32" font-weight="800" letter-spacing="0.05em">RESULTS</text>
  <text x="802" y="504" fill="#C1E4FF" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="0.12em">EVIDENCE TO EXECUTION TO VALUE</text>

  <rect x="488" y="756" width="628" height="58" rx="29" fill="#0E4F79" stroke="#91E7E0" stroke-opacity="0.58"/>
  <text x="802" y="792" fill="#E8FFFB" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="0.08em">
