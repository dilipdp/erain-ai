<svg width="1600" height="940" viewBox="0 0 1600 940" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EraIn Results Cosmos</title>
  <desc id="desc">A cinematic visual showing operating signals flowing through a central results engine.</desc>

  <defs>
    <linearGradient id="bgCos" x1="72" y1="38" x2="1524" y2="902" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030816"/>
      <stop offset="0.48" stop-color="#0A2251"/>
      <stop offset="1" stop-color="#06162F"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(802 462) rotate(90) scale(362 602)">
      <stop stop-color="#56B6FF" stop-opacity="0.32"/>
      <stop offset="0.66" stop-color="#2F7BD7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2F7BD7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotMesh" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C7E9FF" fill-opacity="0.16"/>
