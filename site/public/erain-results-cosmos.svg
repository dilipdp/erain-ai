    <linearGradient id="nodeA" x1="210" y1="206" x2="460" y2="734" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2B5B"/>
      <stop offset="1" stop-color="#0A2146"/>
    </linearGradient>

    <linearGradient id="nodeB" x1="1140" y1="206" x2="1390" y2="734" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2F60"/>
      <stop offset="1" stop-color="#0A2249"/>
    </linearGradient>

    <linearGradient id="linkA" x1="360" y1="278" x2="1240" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CE9FF"/>
      <stop offset="1" stop-color="#89B9FF"/>
    </linearGradient>

    <linearGradient id="linkB" x1="360" y1="468" x2="1240" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84E6FF"/>
      <stop offset="1" stop-color="#74D0FF"/>
    </linearGradient>

    <linearGradient id="linkC" x1="360" y1="656" x2="1240" y2="656" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72E7E0"/>
      <stop offset="1" stop-color="#84C2FF"/>
    </linearGradient>

    <linearGradient id="engine" x1="680" y1="326" x2="922" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5EB3"/>
      <stop offset="1" stop-color="#0C346A"/>
    </linearGradient>

    <filter id="shadowSoft" x="94" y="62" width="1412" height="826" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="10"/>
      <feGaussianBlur stdDeviation="14"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.008 0 0 0 0 0.054 0 0 0 0 0.184 0 0 0 0.5 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>
  </defs>

  <rect width="1600" height="940" fill="url(#bgCos)"/>
  <rect width="1600" height="940" fill="url(#dotMesh)"/>
  <ellipse cx="802" cy="462" rx="604" ry="336" fill="url(#coreGlow)"/>

