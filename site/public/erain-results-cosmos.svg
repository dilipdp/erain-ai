  <text x="234" y="280" fill="#EFF9FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">-22%</text>
  <text x="234" y="308" fill="#BEDCF6" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Delay variance shift</text>

  <rect x="210" y="396" width="252" height="144" rx="18" fill="url(#nodeA)" stroke="#90D3FF" stroke-opacity="0.38"/>
  <text x="234" y="430" fill="#AEE1FF" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.13em">DECISION SPEED</text>
  <text x="234" y="470" fill="#EFF9FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">3.1x</text>
  <text x="234" y="498" fill="#BEDCF6" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Approval cycle gain</text>

  <rect x="210" y="586" width="252" height="144" rx="18" fill="url(#nodeA)" stroke="#83E0D7" stroke-opacity="0.38"/>
  <text x="234" y="620" fill="#B4F0E8" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.13em">VALUE LEDGER</text>
  <text x="234" y="660" fill="#ECFFFC" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">INR 4.6 Cr</text>
  <text x="234" y="688" fill="#B9ECE4" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Recovery trajectory</text>

  <rect x="1140" y="206" width="252" height="144" rx="18" fill="url(#nodeB)" stroke="#9DD4FF" stroke-opacity="0.38"/>
  <text x="1164" y="240" fill="#B5E1FF" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.13em">OWNER MAPPING</text>
