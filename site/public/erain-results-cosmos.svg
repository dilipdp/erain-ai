  <path d="M360 468C558 468 664 468 752 468" stroke="url(#linkB)" stroke-width="4" stroke-linecap="round"/>
  <path d="M360 656C556 642 662 592 752 528" stroke="url(#linkC)" stroke-width="4" stroke-linecap="round"/>
  <path d="M850 408C940 340 1046 292 1240 278" stroke="url(#linkA)" stroke-width="4" stroke-linecap="round"/>
