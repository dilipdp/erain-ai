<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EraIn enterprise futurist command map</title>
  <desc id="desc">A premium command interface showing auditability, decision governance, and ROI attribution converging into the EraIn Core.</desc>

  <defs>
    <linearGradient id="frameGrad" x1="70" y1="56" x2="1532" y2="926" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#153B76"/>
      <stop offset="0.48" stop-color="#2A64A8"/>
      <stop offset="1" stop-color="#153D78"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="112" y1="94" x2="1488" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#031129"/>
      <stop offset="0.46" stop-color="#08204C"/>
      <stop offset="0.76" stop-color="#08285A"/>
      <stop offset="1" stop-color="#020A1D"/>
    </linearGradient>

    <radialGradient id="screenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(798 476) rotate(90) scale(380 660)">
      <stop stop-color="#52AEFF" stop-opacity="0.36"/>
      <stop offset="0.64" stop-color="#257DDB" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#08152F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="edgeGlowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(246 218) rotate(90) scale(232 304)">
      <stop stop-color="#0EC8E6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0EC8E6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="edgeGlowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1326 176) rotate(90) scale(242 310)">
      <stop stop-color="#74B2FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#74B2FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M66 0H0V66" stroke="#95CFFF" stroke-opacity="0.085"/>
    </pattern>

    <linearGradient id="panelGrad" x1="250" y1="154" x2="1336" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pathGrad" x1="420" y1="292" x2="1188" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AE9FF" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#78C1FF" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#56DFCF" stop-opacity="0.84"/>
    </linearGradient>

    <linearGradient id="pillBlue" x1="334" y1="198" x2="592" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E4A84"/>
      <stop offset="1" stop-color="#1B77B7"/>
    </linearGradient>

    <linearGradient id="pillBlue2" x1="986" y1="194" x2="1316" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#124985"/>
      <stop offset="1" stop-color="#2A78C1"/>
    </linearGradient>

    <linearGradient id="pillTeal" x1="632" y1="770" x2="956" y2="834" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A4A66"/>
      <stop offset="1" stop-color="#109092"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(804 472) rotate(90) scale(148 148)">
      <stop stop-color="#348FD9" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#0B2D63" stop-opacity="0.16"/>
    </radialGradient>

    <filter id="blur30" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="panelShadow" x="176" y="112" width="1244" height="780" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="12"/>
      <feGaussianBlur stdDeviation="16"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.008 0 0 0 0 0.068 0 0 0 0 0.224 0 0 0 0.46 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>

    <filter id="nodeShadow" x="242" y="160" width="1122" height="692" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="8"/>
      <feGaussianBlur stdDeviation="10"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.011 0 0 0 0 0.078 0 0 0 0 0.240 0 0 0 0.42 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>

    <filter id="sparkBlur" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="246" y="152" width="1108" height="676" rx="34"/>
    </clipPath>
  </defs>

  <rect x="38" y="40" width="1524" height="900" rx="66" fill="url(#frameGrad)"/>
  <rect x="52" y="54" width="1496" height="872" rx="58" fill="url(#screenGrad)"/>
  <rect x="52" y="54" width="1496" height="872" rx="58" fill="url(#grid)"/>

  <ellipse cx="798" cy="476" rx="686" ry="378" fill="url(#screenGlow)"/>
  <ellipse cx="246" cy="218" rx="234" ry="192" fill="url(#edgeGlowA)" filter="url(#blur30)"/>
  <ellipse cx="1326" cy="176" rx="262" ry="210" fill="url(#edgeGlowB)" filter="url(#blur30)"/>

  <g filter="url(#panelShadow)">
    <rect x="246" y="152" width="1108" height="676" rx="34" fill="url(#panelGrad)" stroke="#CFE8FF" stroke-opacity="0.26"/>
  </g>

  <g clip-path="url(#panelClip)">
    <path d="M246 582C490 548 604 632 810 596C1028 558 1140 454 1354 486" stroke="#BEE6FF" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M246 624C468 590 654 706 844 666C1038 626 1166 520 1354 554" stroke="#C7EAFF" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M246 666C470 632 648 726 834 694C1036 658 1162 556 1354 588" stroke="#CDEEFF" stroke-opacity="0.14" stroke-width="2"/>
  </g>

  <g filter="url(#nodeShadow)">
    <path d="M442 308C594 338 706 396 804 472" stroke="url(#pathGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M1142 310C1044 340 930 398 804 472" stroke="url(#pathGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M786 734C794 638 802 544 804 472" stroke="url(#pathGrad)" stroke-width="5" stroke-linecap="round"/>

    <circle cx="804" cy="472" r="152" fill="#071B3E" stroke="#A4DBFF" stroke-opacity="0.90"/>
    <circle cx="804" cy="472" r="116" fill="#0A2C5C" stroke="#D1EEFF" stroke-opacity="0.60"/>
    <circle cx="804" cy="472" r="88" fill="#0E3E78"/>
    <circle cx="804" cy="472" r="56" fill="url(#coreGlow)"/>

    <circle cx="442" cy="308" r="80" fill="#08274E" stroke="#8DD9FF" stroke-opacity="0.92"/>
    <circle cx="1142" cy="310" r="80" fill="#0A274E" stroke="#9FD1FF" stroke-opacity="0.92"/>
    <circle cx="786" cy="734" r="80" fill="#0A2F4C" stroke="#8EE8DA" stroke-opacity="0.92"/>

    <rect x="318" y="190" width="248" height="56" rx="28" fill="url(#pillBlue)" stroke="#81D8FF" stroke-opacity="0.84"/>
    <text x="442" y="225" fill="#E5F7FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700">Auditability</text>

    <rect x="976" y="186" width="334" height="56" rx="28" fill="url(#pillBlue2)" stroke="#9FD1FF" stroke-opacity="0.84"/>
    <text x="1143" y="221" fill="#E8F6FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700">Decision Governance</text>

    <rect x="620" y="774" width="334" height="56" rx="28" fill="url(#pillTeal)" stroke="#8CE7DA" stroke-opacity="0.84"/>
    <text x="787" y="809" fill="#E7FFFB" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700">ROI Attribution</text>

    <text x="804" y="450" fill="#EAF6FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="31" font-weight="800" letter-spacing="0.06em">ERAIN CORE</text>
    <text x="804" y="485" fill="#BEE1FF" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="0.06em">AUDIT TO DECISION TO OUTCOME</text>
    <text x="804" y="512" fill="#A9D5FF" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">EXECUTION INTELLIGENCE LAYER</text>
  </g>

  <g filter="url(#sparkBlur)" opacity="0.92">
    <circle cx="598" cy="394" r="4" fill="#A2D8FF"/>
    <circle cx="714" cy="426" r="4" fill="#99D8FF"/>
    <circle cx="958" cy="404" r="4" fill="#8EC9FF"/>
    <circle cx="1032" cy="566" r="4" fill="#86C3FF"/>
    <circle cx="870" cy="642" r="5" fill="#8DE9DC"/>
    <circle cx="724" cy="622" r="4" fill="#88E4E2"/>
    <circle cx="1184" cy="356" r="3" fill="#A5D6FF"/>
    <circle cx="392" cy="346" r="3" fill="#8EE0FF"/>
    <circle cx="944" cy="744" r="3" fill="#9EDBCF"/>
  </g>
</svg>
