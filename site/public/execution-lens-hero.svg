<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EraIn tri-axis intelligence canvas</title>
  <desc id="desc">A futuristic command canvas where auditability, decision governance, and ROI attribution converge in a central EraIn core.</desc>

  <defs>
    <linearGradient id="bg" x1="70" y1="50" x2="1520" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="0.45" stop-color="#081B3D"/>
      <stop offset="0.74" stop-color="#0B2251"/>
      <stop offset="1" stop-color="#040A18"/>
    </linearGradient>

    <radialGradient id="coreHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(804 486) rotate(90) scale(340 540)">
      <stop stop-color="#4EAFFF" stop-opacity="0.50"/>
      <stop offset="0.55" stop-color="#4EAFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4EAFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 220) rotate(90) scale(220 280)">
      <stop stop-color="#21D4E8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#21D4E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1300 220) rotate(90) scale(220 280)">
      <stop stop-color="#7AB6FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7AB6FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" stroke="#9DD0FF" stroke-opacity="0.09"/>
    </pattern>

    <linearGradient id="glassPanel" x1="214" y1="154" x2="1378" y2="816" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="beam" x1="380" y1="268" x2="1198" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DEAFF" stop-opacity="0.92"/>
      <stop offset="0.50" stop-color="#78C5FF" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#59E0D1" stop-opacity="0.86"/>
    </linearGradient>

    <linearGradient id="pillA" x1="286" y1="214" x2="560" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E4C86"/>
      <stop offset="1" stop-color="#1B7AB9"/>
    </linearGradient>

    <linearGradient id="pillB" x1="1038" y1="214" x2="1314" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F4C88"/>
      <stop offset="1" stop-color="#2A78C2"/>
    </linearGradient>

    <linearGradient id="pillC" x1="650" y1="756" x2="958" y2="818" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B4A66"/>
      <stop offset="1" stop-color="#0F9696"/>
    </linearGradient>

    <radialGradient id="coreInner" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(804 486) rotate(90) scale(146)">
      <stop stop-color="#2D8FDE" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#0A2E63" stop-opacity="0.12"/>
    </radialGradient>

    <filter id="blur28" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="panelShadow" x="146" y="98" width="1310" height="810" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="14"/>
      <feGaussianBlur stdDeviation="18"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.008 0 0 0 0 0.067 0 0 0 0 0.220 0 0 0 0.47 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>

    <filter id="nodeShadow" x="226" y="156" width="1156" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="8"/>
      <feGaussianBlur stdDeviation="10"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.010 0 0 0 0 0.078 0 0 0 0 0.238 0 0 0 0.42 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>

    <filter id="sparkBlur" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="panelClip">
      <rect x="214" y="150" width="1172" height="686" rx="34"/>
    </clipPath>
