  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <ellipse cx="804" cy="486" rx="620" ry="346" fill="url(#coreHalo)"/>
  <ellipse cx="300" cy="220" rx="230" ry="188" fill="url(#leftGlow)" filter="url(#blur28)"/>
  <ellipse cx="1300" cy="220" rx="232" ry="188" fill="url(#rightGlow)" filter="url(#blur28)"/>

  <g filter="url(#panelShadow)">
    <rect x="214" y="150" width="1172" height="686" rx="34" fill="url(#glassPanel)" stroke="#CDE8FF" stroke-opacity="0.26"/>
  </g>

  <g clip-path="url(#panelClip)">
    <path d="M214 574C456 540 610 628 824 592C1052 554 1178 450 1386 488" stroke="#BEE6FF" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M214 620C450 586 668 702 852 664C1060 624 1192 520 1386 558" stroke="#C7EAFF" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M214 664C454 630 650 730 846 694C1058 656 1188 552 1386 592" stroke="#CEEFFF" stroke-opacity="0.14" stroke-width="2"/>

    <rect x="258" y="184" width="320" height="160" rx="24" fill="#081F43" fill-opacity="0.72" stroke="#8DD8FF" stroke-opacity="0.30"/>
    <text x="282" y="220" fill="#A8DEFF" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em">AUDITABILITY</text>
    <text x="282" y="264" fill="#EAF6FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">94%</text>
    <text x="282" y="294" fill="#B8DBF7" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Evidence confidence index</text>

    <rect x="1020" y="184" width="320" height="160" rx="24" fill="#0A2348" fill-opacity="0.72" stroke="#9FD4FF" stroke-opacity="0.30"/>
    <text x="1044" y="220" fill="#B7E0FF" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em">DECISION GOVERNANCE</text>
    <text x="1044" y="264" fill="#ECF7FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">100%</text>
    <text x="1044" y="294" fill="#B8D9F3" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Ownership and approvals mapped</text>

    <rect x="604" y="732" width="396" height="114" rx="24" fill="#0A2C4A" fill-opacity="0.74" stroke="#8EE7DA" stroke-opacity="0.36"/>
    <text x="628" y="766" fill="#C2F5EE" font-family="Sora, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em">ROI ATTRIBUTION</text>
    <text x="628" y="800" fill="#E8FFFB" font-family="Sora, Segoe UI, sans-serif" font-size="28" font-weight="800">INR 3.2 Cr opportunity</text>
  </g>

  <g filter="url(#nodeShadow)">
    <path d="M438 314C590 344 710 402 804 486" stroke="url(#beam)" stroke-width="5" stroke-linecap="round"/>
    <path d="M1142 314C1042 346 928 404 804 486" stroke="url(#beam)" stroke-width="5" stroke-linecap="round"/>
    <path d="M804 732C804 658 804 564 804 486" stroke="url(#beam)" stroke-width="5" stroke-linecap="round"/>

    <circle cx="804" cy="486" r="156" fill="#071B3E" stroke="#A4DBFF" stroke-opacity="0.90"/>
    <circle cx="804" cy="486" r="118" fill="#0A2B5B" stroke="#D1EEFF" stroke-opacity="0.60"/>
    <circle cx="804" cy="486" r="88" fill="#0E3E78"/>
    <circle cx="804" cy="486" r="56" fill="url(#coreInner)"/>

    <circle cx="438" cy="314" r="82" fill="#08274D" stroke="#8DD9FF" stroke-opacity="0.92"/>
    <circle cx="1142" cy="314" r="82" fill="#0A274E" stroke="#9FD1FF" stroke-opacity="0.92"/>
    <circle cx="804" cy="732" r="82" fill="#0A2F4B" stroke="#8EE8DA" stroke-opacity="0.92"/>

    <rect x="302" y="206" width="272" height="58" rx="29" fill="url(#pillA)" stroke="#81D8FF" stroke-opacity="0.84"/>
    <text x="438" y="242" fill="#E5F7FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700">Auditability</text>

    <rect x="1006" y="206" width="272" height="58" rx="29" fill="url(#pillB)" stroke="#9FD1FF" stroke-opacity="0.84"/>
    <text x="1142" y="242" fill="#E8F6FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700">Decision Governance</text>

    <rect x="650" y="756" width="308" height="58" rx="29" fill="url(#pillC)" stroke="#8CE7DA" stroke-opacity="0.84"/>
    <text x="804" y="792" fill="#E7FFFB" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="18" font-weight="700">ROI Attribution</text>

    <text x="804" y="464" fill="#EAF6FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="31" font-weight="800" letter-spacing="0.06em">ERAIN CORE</text>
    <text x="804" y="500" fill="#BEE1FF" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="0.06em">AUDIT TO DECISION TO OUTCOME</text>
    <text x="804" y="526" fill="#A9D5FF" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">EXECUTION INTELLIGENCE LAYER</text>
  </g>

  <g filter="url(#sparkBlur)" opacity="0.92">
    <circle cx="596" cy="398" r="4" fill="#A2D8FF"/>
    <circle cx="710" cy="432" r="4" fill="#99D8FF"/>
    <circle cx="952" cy="412" r="4" fill="#8EC9FF"/>
    <circle cx="1028" cy="564" r="4" fill="#86C3FF"/>
    <circle cx="870" cy="640" r="5" fill="#8DE9DC"/>
    <circle cx="724" cy="622" r="4" fill="#88E4E2"/>
    <circle cx="1182" cy="360" r="3" fill="#A5D6FF"/>
    <circle cx="390" cy="350" r="3" fill="#8EE0FF"/>
    <circle cx="944" cy="740" r="3" fill="#9EDBCF"/>
  </g>
</svg>
