    <path d="M848 458C940 458 1040 458 1228 458" stroke="url(#cmdLaneB)" stroke-width="4" stroke-linecap="round"/>
    <path d="M848 516C940 578 1042 632 1228 644" stroke="url(#cmdLaneC)" stroke-width="4" stroke-linecap="round"/>
