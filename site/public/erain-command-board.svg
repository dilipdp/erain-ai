    <linearGradient id="cmdChipRight" x1="1118" y1="196" x2="1388" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2D5E"/>
      <stop offset="1" stop-color="#0A2148"/>
    </linearGradient>

    <filter id="cmdSoftShadow" x="98" y="54" width="1404" height="826" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="10"/>
      <feGaussianBlur stdDeviation="14"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.008 0 0 0 0 0.056 0 0 0 0 0.188 0 0 0 0.48 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>

    <filter id="cmdGlow" x="322" y="204" width="956" height="516" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.6"/>
    </filter>
