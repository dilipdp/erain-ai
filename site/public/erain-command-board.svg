<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EraIn Command Board Visual</title>
  <desc id="desc">Premium command board visual showing audit, governance, and ROI streams converging in the EraIn operating system.</desc>

  <defs>
    <linearGradient id="cmdBg" x1="96" y1="44" x2="1498" y2="868" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040915"/>
      <stop offset="0.52" stop-color="#0A214B"/>
      <stop offset="1" stop-color="#06152D"/>
    </linearGradient>

    <radialGradient id="cmdAmbient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(806 454) rotate(90) scale(368 598)">
      <stop stop-color="#4EAFFF" stop-opacity="0.30"/>
      <stop offset="0.66" stop-color="#2F79D6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2F79D6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="cmdGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#C2E5FF" stroke-opacity="0.08"/>
    </pattern>

    <linearGradient id="cmdPanel" x1="164" y1="96" x2="1430" y2="816" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="cmdLaneA" x1="372" y1="274" x2="1228" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84E6FF"/>
      <stop offset="1" stop-color="#86B6FF"/>
    </linearGradient>

    <linearGradient id="cmdLaneB" x1="372" y1="458" x2="1228" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#88E5FF"/>
      <stop offset="1" stop-color="#75CFFF"/>
