  <text x="1142" y="422" fill="#B2DEFF" font-family="Sora, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="0.13em">RISK REDUCTION</text>
  <text x="1142" y="462" fill="#EFF9FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">31%</text>
