  <rect width="1600" height="920" fill="url(#cmdBg)"/>
  <rect width="1600" height="920" fill="url(#cmdGrid)"/>
  <ellipse cx="806" cy="454" rx="598" ry="332" fill="url(#cmdAmbient)"/>

