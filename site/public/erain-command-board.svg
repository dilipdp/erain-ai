  <rect x="1118" y="576" width="270" height="150" rx="20" fill="url(#cmdChipRight)" stroke="#82DFD6" stroke-opacity="0.40"/>
  <text x="1142" y="612" fill="#B3F0E8" font-family="Sora, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="0.13em">VALUE LEDGER</text>
  <text x="1142" y="652" fill="#ECFFFC" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">INR 4.6 Cr</text>
  <text x="1142" y="680" fill="#B9ECE4" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600">Annualized path</text>

  <path d="M800 322L926 458L800 594L674 458L800 322Z" fill="url(#cmdCore)" stroke="#9CD7FF" stroke-opacity="0.72"/>
  <path d="M800 366L882 458L800 550L718 458L800 366Z" fill="#0F376D" stroke="#84CBFF" stroke-opacity="0.62"/>
  <text x="800" y="456" fill="#EEF8FF" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-size="32" font-weight="800" letter-spacing="0.05em">ERAIN</text>
