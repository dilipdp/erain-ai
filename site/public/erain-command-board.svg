  <text x="1142" y="232" fill="#B6E2FF" font-family="Sora, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="0.13em">ACTION STACK</text>
  <text x="1142" y="272" fill="#EFF9FF" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="800">42</text>
