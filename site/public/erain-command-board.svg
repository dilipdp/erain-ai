    <linearGradient id="cmdLaneC" x1="372" y1="644" x2="1228" y2="644" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E7E0"/>
      <stop offset="1" stop-color="#7FC1FF"/>
    </linearGradient>

    <linearGradient id="cmdCore" x1="674" y1="318" x2="926" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E5BB0"/>
      <stop offset="1" stop-color="#0C346A"/>
